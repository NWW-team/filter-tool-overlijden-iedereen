<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filtertool melding van overlijden</title>
  <meta name="description" content="Vraag voor vraag bepalen of je moet overleggen bij een melding van overlijden, en met wie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Niet blokkerend: zonder netwerk rendert de tool meteen met de systeemletters. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
        media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="banner">
    <div class="banner-binnen">
      <div>
        <h1 class="bannerkop">Overlijdensgeval <br>in het buitenland</h1>
        <p class="bannertool">Filtertool voor medewerkers van BZ</p>
        <p class="bannerbelofte">Met zorg. Wereldwijd. Voor Nederlanders.</p>
      </div>
      <p class="bannermerk">
        Service<br>Bescherming<br>Verbinding
        <span class="bannerstreep" aria-hidden="true"></span>
        <span class="bannerslot">Altijd dichtbij, <br>ook daar.</span>
      </p>
    </div>
  </header>
  <div id="app"></div>
  <noscript>
    <p style="max-width:640px;margin:32px auto;padding:0 16px">
      Deze filtertool werkt alleen met JavaScript aan. Zonder JavaScript kan de tool
      geen vragen stellen.
    </p>
  </noscript>
  <script src="data/landen.js"></script>
  <script src="data/beslislogica.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
